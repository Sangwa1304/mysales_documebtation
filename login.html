<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Connexion — MYSALES</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body class="auth-page">
    <main class="auth-card">
      <!-- =====================================================
           LOGO
           ===================================================== -->

      <div class="auth-logo">
        <div
          class="brand-mark"
          style="width: 58px; height: 58px; font-size: 26px"
        >
          M
        </div>
      </div>

      <!-- =====================================================
           TITRE
           ===================================================== -->

      <div style="text-align: center">
        <div class="eyebrow" style="margin-bottom: 6px">
          ESPACE PROFESSIONNEL
        </div>

        <h1>Bienvenue sur MYSALES</h1>

        <p class="muted">
          Connectez-vous pour accéder à votre espace de gestion.
        </p>
      </div>

      <!-- =====================================================
           MESSAGE
           ===================================================== -->

      <div id="message" class="alert alert-danger" hidden></div>

      <!-- =====================================================
           FORMULAIRE
           ===================================================== -->

      <form id="loginForm" class="auth-form">
        <!-- EMAIL -->

        <label>
          Adresse e-mail

          <input
            id="email"
            name="email"
            type="email"
            placeholder="exemple@entreprise.com"
            autocomplete="email"
            required
          />
        </label>

        <!-- MOT DE PASSE -->

        <label>
          Mot de passe

          <div class="password-field">
            <input
              id="motDePasse"
              name="motDePasse"
              type="password"
              placeholder="Votre mot de passe"
              autocomplete="current-password"
              required
            />

            <button
              type="button"
              id="voirMotDePasse"
              class="password-toggle"
              aria-label="Afficher le mot de passe"
              title="Afficher le mot de passe"
            >
              👁️
            </button>
          </div>
        </label>

        <!-- ===================================================
             OPTIONS
             =================================================== -->

        <div
          style="
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
          "
        >
          <label
            style="
              display: flex;
              flex-direction: row;
              align-items: center;
              gap: 7px;
              font-size: 11px;
              font-weight: 600;
            "
          >
            <input
              id="seSouvenir"
              type="checkbox"
              style="width: 15px; height: 15px; min-height: 15px"
            />

            Se souvenir de moi
          </label>

          <a
            href="forgot-password.html"
            style="color: #2563eb; font-size: 12px; font-weight: 700"
          >
            Mot de passe oublié ?
          </a>
        </div>

        <!-- ===================================================
             BOUTON CONNEXION
             =================================================== -->

        <button
          id="boutonConnexion"
          type="submit"
          class="btn btn-primary"
          style="min-height: 48px; font-size: 14px"
        >
          <span id="texteConnexion"> Se connecter </span>
        </button>
      </form>

      <!-- =====================================================
           FOOTER
           ===================================================== -->

      <div
        style="
          text-align: center;
          margin-top: 25px;
          padding-top: 18px;
          border-top: 1px solid #e5e7eb;
        "
      >
        <p class="muted" style="font-size: 11px">
          MYSALES · Gestion commerciale
        </p>

        <p class="muted" style="font-size: 10px; margin-top: 4px">
          Votre espace professionnel sécurisé
        </p>
      </div>
    </main>

    <script src="login.js"></script>
  </body>
</html>
