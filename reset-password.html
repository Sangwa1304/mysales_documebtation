<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Nouveau mot de passe — MYSALES</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body class="auth-page">
    <div class="auth-shell">
      <!-- IDENTITÉ -->

      <div class="auth-brand">
        <div class="brand-mark">M</div>

        <div>
          <strong> MYSALES </strong>

          <span> Gestion commerciale </span>
        </div>
      </div>

      <!-- FORMULAIRE -->

      <div class="auth-card">
        <div class="eyebrow">SÉCURITÉ</div>

        <h1>Nouveau mot de passe</h1>

        <p class="muted">
          Choisissez un nouveau mot de passe d'au moins 8 caractères.
        </p>

        <form id="resetForm">
          <label>
            Nouveau mot de passe

            <input
              type="password"
              id="password"
              minlength="8"
              autocomplete="new-password"
              required
            />
          </label>

          <label>
            Confirmer le mot de passe

            <input
              type="password"
              id="confirm"
              minlength="8"
              autocomplete="new-password"
              required
            />
          </label>

          <button class="btn btn-primary btn-block" type="submit" id="btn">
            Enregistrer
          </button>

          <p id="message" class="form-message"></p>
        </form>

        <a class="forgot-link" href="login.html"> Retour à la connexion </a>
      </div>
    </div>

    <script src="reset-password.js"></script>
  </body>
</html>
