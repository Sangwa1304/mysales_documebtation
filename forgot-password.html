<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Mot de passe oublié — MYSALES</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body class="auth-page">
    <main class="auth-card">
      <!-- ===================================================
           LOGO
           =================================================== -->

      <div class="auth-logo">
        <div
          class="brand-mark"
          style="width: 58px; height: 58px; font-size: 26px"
        >
          M
        </div>
      </div>

      <!-- ===================================================
           TITRE
           =================================================== -->

      <div style="text-align: center">
        <div class="eyebrow" style="margin-bottom: 6px">SÉCURITÉ DU COMPTE</div>

        <h1>Mot de passe oublié ?</h1>

        <p class="muted">
          Entrez votre adresse e-mail pour recevoir un lien de réinitialisation.
        </p>
      </div>

      <!-- ===================================================
           MESSAGE
           =================================================== -->

      <div id="message" class="alert" hidden></div>

      <!-- ===================================================
           FORMULAIRE
           =================================================== -->

      <form id="forgotPasswordForm" class="auth-form">
        <label>
          Adresse e-mail

          <input
            id="email"
            name="email"
            type="email"
            placeholder="exemple@entreprise.com"
            autocomplete="email"
            required
          />
        </label>

        <button
          id="boutonEnvoyer"
          type="submit"
          class="btn btn-primary"
          style="min-height: 48px; font-size: 14px"
        >
          <span id="texteBouton"> Envoyer le lien </span>
        </button>
      </form>

      <!-- ===================================================
           RETOUR CONNEXION
           =================================================== -->

      <div style="text-align: center; margin-top: 18px">
        <a
          href="login.html"
          style="color: #2563eb; font-size: 12px; font-weight: 700"
        >
          ← Retour à la connexion
        </a>
      </div>

      <!-- ===================================================
           INFORMATION SÉCURITÉ
           =================================================== -->

      <div
        style="
          margin-top: 22px;
          padding: 14px;
          border-radius: 12px;
          background: #f8fafc;
          border: 1px solid #e5e7eb;
        "
      >
        <p class="muted" style="font-size: 11px; line-height: 1.6; margin: 0">
          🔐 Pour votre sécurité, le lien de réinitialisation est temporaire et
          ne peut être utilisé qu'une seule fois.
        </p>
      </div>

      <!-- ===================================================
           FOOTER
           =================================================== -->

      <div
        style="
          text-align: center;
          margin-top: 25px;
          padding-top: 18px;
          border-top: 1px solid #e5e7eb;
        "
      >
        <p class="muted" style="font-size: 11px">
          MYSALES · Gestion commerciale
        </p>
      </div>
    </main>

    <script src="forgot-password.js"></script>
  </body>
</html>
