<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Clients — MYSALES</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header class="app-header">
      <a class="brand" href="index.html">
        <span class="brand-mark">M</span>

        <span>
          <strong>MYSALES</strong>
          <small>Gestion commerciale</small>
        </span>
      </a>

      <nav id="mainNav">
        <a href="index.html"> Tableau de bord </a>

        <a href="ventes.html"> Ventes </a>

        <a href="produits.html"> Produits </a>

        <a class="active" href="clients.html"> Clients </a>

        <a href="dashboard.html"> Rapports </a>
      </nav>

      <div class="header-user">
        <span id="nomUtilisateur">...</span>

        <small id="roleUtilisateur">...</small>

        <button id="boutonDeconnexion" class="btn btn-light" type="button">
          Déconnexion
        </button>
      </div>
    </header>

    <main class="app-main">
      <section class="page-top">
        <div>
          <span class="eyebrow"> CLIENTÈLE </span>

          <h1>Gestion des clients</h1>

          <p class="muted">
            Gérez vos clients et leurs informations commerciales.
          </p>
        </div>

        <button id="btnNouveauClient" class="btn btn-primary" type="button">
          + Ajouter un client
        </button>
      </section>

      <section class="toolbar">
        <input
          type="text"
          id="rechercheClient"
          placeholder="Rechercher un client..."
        />
      </section>

      <section id="formulaireClient" class="panel" hidden>
        <div class="panel-head">
          <div>
            <span class="eyebrow"> CLIENT </span>

            <h2 id="titreFormulaireClient">Ajouter un client</h2>
          </div>
        </div>

        <form id="clientForm" class="grid-form">
          <label>
            Nom complet

            <input
              type="text"
              id="nomClient"
              placeholder="Ex : Jean Kabila"
              required
            />
          </label>

          <label>
            Téléphone

            <input
              type="text"
              id="telephoneClient"
              placeholder="Ex : 0810000001"
              required
            />
          </label>

          <label>
            Adresse e-mail

            <input
              type="email"
              id="emailClient"
              placeholder="client@email.com"
            />
          </label>

          <label>
            Ville

            <input type="text" id="villeClient" placeholder="Ex : Kinshasa" />
          </label>

          <div class="form-actions">
            <button
              class="btn btn-primary"
              type="submit"
              id="btnEnregistrerClient"
            >
              Enregistrer
            </button>

            <button class="btn btn-light" type="button" id="btnAnnulerClient">
              Annuler
            </button>
          </div>
        </form>
      </section>

      <section class="panel">
        <div class="panel-head">
          <div>
            <span class="eyebrow"> BASE CLIENTS </span>

            <h2>Clients</h2>
          </div>

          <span id="compteurClients" class="badge"> 0 client </span>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Client</th>

                <th>Téléphone</th>

                <th>E-mail</th>

                <th>Ville</th>

                <th>Date</th>

                <th>Actions</th>
              </tr>
            </thead>

            <tbody id="clientsList">
              <tr>
                <td colspan="6">Chargement...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="clients.js"></script>

    <script src="auth.js"></script>
  </body>
</html>
