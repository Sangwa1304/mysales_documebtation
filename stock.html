<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MYSALES - Gestion du stock</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        header {
            background: #0f172a;
            color: white;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 24px;
        }

        nav {
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 14px;
        }

        nav a:hover {
            color: #38bdf8;
        }

        main {
            max-width: 1400px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .top h2 {
            font-size: 28px;
            color: #0f172a;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 10px 16px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-refresh {
            background: #2563eb;
            color: white;
        }

        .btn-refresh:hover {
            background: #1d4ed8;
        }

        .kpis {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            margin-bottom: 25px;
        }

        .kpi {
            background: white;
            padding: 22px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }

        .kpi p {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .kpi h3 {
            font-size: 28px;
            color: #0f172a;
        }

        .filters {
            background: white;
            padding: 20px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #dbe3ef;
            border-radius: 8px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #2563eb;
        }

        .table-container {
            background: white;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #edf1f7;
        }

        th {
            background: #f8fafc;
            color: #475569;
            font-size: 14px;
        }

        td {
            font-size: 14px;
        }

        .stock-ok {
            color: #15803d;
            font-weight: bold;
        }

        .stock-faible {
            color: #d97706;
            font-weight: bold;
        }

        .stock-rupture {
            color: #dc2626;
            font-weight: bold;
        }

        .empty {
            text-align: center;
            padding: 40px;
            color: #64748b;
        }

        @media (max-width: 900px) {
            .kpis {
                grid-template-columns: repeat(2, 1fr);
            }

            .filters {
                grid-template-columns: 1fr;
            }

            header {
                flex-direction: column;
                gap: 15px;
            }
        }

        @media (max-width: 600px) {
            .kpis {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>MYSALES</h1>

    <nav id="mainNav">
        <a href="index.html">Tableau de bord</a>
        <a href="ventes.html">Ventes</a>
        <a href="produits.html">Produits</a>
        <a href="stock.html">Stock</a>
        <a href="clients.html">Clients</a>
        <a href="dashboard.html">Rapports</a>
    </nav>
</header>

<main>

    <div class="top">
        <h2>Gestion du stock</h2>

        <button class="btn-refresh" id="boutonActualiser">
            Actualiser
        </button>
    </div>

    <section class="kpis">

        <div class="kpi">
            <p>Produits</p>
            <h3 id="nombreProduits">0</h3>
        </div>

        <div class="kpi">
            <p>Stock total</p>
            <h3 id="stockTotal">0</h3>
        </div>

        <div class="kpi">
            <p>Stock faible</p>
            <h3 id="stockFaible">0</h3>
        </div>

        <div class="kpi">
            <p>Ruptures</p>
            <h3 id="stockRupture">0</h3>
        </div>

    </section>

    <section class="filters">

        <input
            type="text"
            id="rechercheStock"
            placeholder="Rechercher un produit..."
        >

        <select id="filtreStock">
            <option value="tous">Tous les stocks</option>
            <option value="normal">Stock normal</option>
            <option value="faible">Stock faible</option>
            <option value="rupture">Rupture</option>
        </select>

        <select id="filtreMouvement">
            <option value="tous">Tous les mouvements</option>
            <option value="entree">Entrées</option>
            <option value="sortie">Sorties</option>
            <option value="vente">Ventes</option>
            <option value="ajustement">Ajustements</option>
        </select>

    </section>

    <section class="table-container">

        <table>

            <thead>
                <tr>
                    <th>Produit</th>
                    <th>Prix</th>
                    <th>Stock</th>
                    <th>État</th>
                    <th>Dernier mouvement</th>
                    <th>Date</th>
                </tr>
            </thead>

            <tbody id="stockList">
                <tr>
                    <td colspan="6" class="empty">
                        Chargement du stock...
                    </td>
                </tr>
            </tbody>

        </table>

    </section>

</main>

<script src="stock.js"></script>
<script src="auth.js"></script>

</body>
</html>
